# Rescue mission configuration.
#
# Positions are AirSim world NED, in metres from the PlayerStart:
#   x = (Unreal X - PlayerStart X) / 100
#   y = (Unreal Y - PlayerStart Y) / 100
# Read Unreal X/Y off an actor's Location in the editor's Details panel.
# Heights are metres above the ground at the drone's takeoff point.

area:
  corner_a: [-42.7, -42.3]     # any two opposite corners of the search rectangle
  corner_b: [5.8, 44.2]
  max_obstacle_height: 15       # tallest building or tree inside the rectangle

drone:
  name: Drone1
  port: 41451
  spawn_ned: [0, 4, -5]         # must match Vehicles.Drone1 X, Y, Z in settings.json
  max_speed: 8                  # search speed cap; the measured frame rate can lower it
  climb_speed: 3
  transit_speed: 8
  turn_speed: 3                 # the hop from one lane's end to the next lane's start
  turn_time_s: 3                # stopping, turning and accelerating at each lane end

camera:
  name: bottom_center           # the camera used for the search; must match settings.json
  tilt_deg: 45                  # below the horizon, looking along the lane; 90 = straight down
  hfov_deg: 60
  width_px: 1280
  height_px: 720
  exposure_s: 0.001             # a real camera's exposure; bounds speed by motion blur

detector:
  model: models/person_yolo11s.onnx  # relative to this folder
  person_class: 0
  device: dml:1                  # auto = CUDA, else DirectML GPU 1, else GPU 0, else the CPU;
                                #   or cpu, cuda, dml:0, dml:1 ... (DirectML GPU number). On a laptop
                                #   GPU 0 is the integrated one that draws the screen: don't use it
  conf_threshold: 0.25
  iou_threshold: 0.45           # boxes overlapping more than this are merged (NMS)
  input_size: 640               # YOLO11 input
  tiles_x: 2                    # the image is split into tiles_x * tiles_y tiles, each
  tiles_y: 1                    #   resized to input_size, so small people keep their pixels
  tile_overlap: 0.2             # must exceed the largest person in pixels (lying, ~75 px at 25 m)
  fps_per_tile: 10              # detector throughput, tiles per second
  person_size_m: 0.45           # smallest size of a person in view (shoulder width)
  min_person_px: 12             # smallest person the detector finds reliably, in input pixels

search:
  safety_margin: 5              # above the tallest obstacle
  min_altitude: 10
  max_altitude: 20              # = the lowest safe altitude: people look biggest there (higher, the
                                #   planner would trade lanes for height)
  side_overlap: 0.2             # overlap between neighbouring lanes
  lane_axis: y                  # lanes run along x or y; auto = whichever gives the shorter mission
  max_blur_px: 1.0              # motion blur allowed during one exposure
  min_frames_per_point: 6       # frames every ground point must appear in: twice frames_to_confirm,
                                #   since the detector misses some
  min_candidate_confidence: 0.4 # weaker search detections don't start a confirmation
  frames_to_confirm: 3          # a new person must be detected in this many search frames (within
                                #   confirm.merge_radius, none more than 5 frames apart) to start a confirmation

confirm:
  min_person_px: 40             # approach and zoom until a person is this big
  min_altitude: 17              # never descend below this while confirming: the tree tops here
                                #   reach ~15 m (at 12 m the drone clipped them)
  min_fov_deg: 10               # the camera can zoom in to this horizontal field of view
  speed: 1.5                    # along the line of sight, down and back up
  use_depth: false              # measure a confirmed person with the depth camera (slow in AirSim)
  frames: 12                    # N frames are checked from each viewpoint ...
  required: 3                   #   ... and the person must be found in k of them from one viewpoint
  arc_offsets_deg: [0, 30, -30] # viewpoints around the person: the approach, then along an arc to
                                #   either side (same distance and height), until one sees them
  arc_step_deg: 10              # the arc is flown in steps this size, facing the person
  max_attempts: 2               # a rejected candidate is tried again if detected again ...
  retry_distance: 10            #   ... from at least this far from where it was last tried
  frame_interval_s: 0.6
  save_images: true             # save each candidate's search frame and confirm frames to output/
  match_radius: 3.0             # a detection this close to the candidate counts as a hit
  merge_radius: 6.0             # a new detection this close to a known one is the same person

publish:
  endpoint: tcp://*:5556        # ZeroMQ PUB socket; listen_victims.py subscribes to it
  topic: /rescue/victims

ground_truth:                   # tags of the people placed in the level, to measure position error
  - Victim_01
  - Victim_02

ugv:                            # the Husky (ugv.py)
  name: Car1
  port: 41452
  spawn_ned: [2, 0, -1.5]       # must match Vehicles.Car1 X, Y, Z in settings.json; home is here
  lidar: Lidar1                 # Vehicles.Car1.Sensors in settings.json
  subscribe: tcp://localhost:5556   # where mission.py publishes victims
  medkits: [MedKit_1, MedKit_2, MedKit_3, MedKit_4]  # tags of kit actors placed in the level (Movable)
  max_speed: 2.0                # m/s on straight path (it tipped over at 3)
  slow_speed: 0.7               # in turns and near the goal
  max_throttle: 0.6             # never floor it: sudden pulls tip it
  lookahead_m: 2.5              # pure pursuit
  steering_gain: 1.2            # steering per radian of heading error
  steering_sign: 1              # -1 if the Husky turns the wrong way
  robot_radius_m: 0.7           # (0.6 let a corner clip a pole squeezing past)
  safety_margin_m: 0.4          # obstacles are grown by radius + margin
  stop_distance_m: 2.0          # stop this far from a victim
  kit_offset_m: 1.0             # the kit goes this far from the victim, on the UGV's side
  home_radius_m: 1.5
  base_height_m: 0.0            # the UGV's origin above the ground: ugv.py --check prints the value
                                #   (0.6 put the ground ~0.65 m high: the lidar mapped it as obstacles)
  obstacle_min_height_m: 0.3    # lidar points this high above the ground and up to ... (0.5 missed
                                #   the drone on the ground, stumps and logs)
  obstacle_max_height_m: 1.0    #   ... this are obstacles; lower is ground, higher passes over the
                                #   Husky (~0.4 m tall), e.g. branches and eaves. Walls, trunks and
                                #   people still show between the two
  drop_m: 0.6                   # lidar points this far below the ground are a drop (edge, ditch)
  area_margin_m: 5              # the UGV stays within the search area plus this
  map_size_m: 240               # square map centred on home
  map_resolution_m: 0.25
  replan_s: 1.0
  no_path_timeout_s: 10
  control_period_s: 0.1
